name: CI

on:
  pull_request:
    # GitHub skips this workflow only when EVERY changed file matches, so a workflows-only PR runs
    # only workflows-content.yml and a mixed PR runs both (PRD §16 WF-20).
    paths-ignore: ['content/workflows/**']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Share-workflow skill copies are byte-identical (WF-14)
        run: |
          a=.claude/skills/share-workflow/SKILL.md
          b=.agents/skills/share-workflow/SKILL.md
          if [ ! -e "$a" ] && [ ! -e "$b" ]; then echo "no share-workflow skill yet"; exit 0; fi
          cmp "$a" "$b"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run exercises:verify

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Start Supabase
        run: supabase start
      - name: Write .env.local from supabase status
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > .env.local
      - run: npm run seed
      - run: npm run db:reset:test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
