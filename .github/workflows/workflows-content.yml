name: Workflows content

# Content lane (PRD §16 WF-20): PRs that change content/workflows/** run only these two jobs
# (ci.yml ignores workflows-only PRs). No client-name scan: human review at merge is that control.
# `npm run gate:merge` requires check runs named exactly `validate` and `gitleaks`.

# GitHub Actions is off for this account (billing), so CI is run manually: `npm run ci:local -- <pr#>`
# (scripts/ci-local.sh). The original triggers are kept below, commented out; restore them to re-enable CI.
on:
  workflow_dispatch:
#  pull_request:
#    paths: ['content/workflows/**']
#  push:
#    branches: [main]
#    paths: ['content/workflows/**']

permissions:
  contents: read

concurrency:
  group: workflows-content-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.21.2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Schema, body sections and the required `client_safe: confirmed` (WF-1).
      - run: npm run workflows:validate

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The pinned gitleaks CLI binary (not the gitleaks GitHub Action, which needs a licence for orgs).
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f "$tarball" checksums.txt gitleaks
      # Every commit in the range, not just the final diff: PR branch history stays readable on GitHub
      # after a squash merge. --redact keeps secrets out of the CI log.
      - name: Scan every commit in the range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE}..${PUSH_SHA}"
          else
            range="${PUSH_SHA}~1..${PUSH_SHA}"
          fi
          echo "scanning commits in $range"
          gitleaks git --redact --verbose --log-opts="$range" .
